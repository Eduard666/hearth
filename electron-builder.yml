appId: com.Eduard666.hearth
productName: Hearth
copyright: "Copyright 2024 Eduard666"

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"

publish:
  provider: github
  owner: Eduard666
  repo: hearth
  # electron-builder defaults to a draft release, which electron-updater cannot see -
  # the app would never find an update. Publish live instead.
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: "Hearth-${version}-Setup.exe"

nsis:
  # One-click + per-user is what makes updates invisible, the way the Claude desktop app
  # behaves. An assisted installer shows its progress and finish pages on every update,
  # and a per-machine install under Program Files needs admin rights, so each update
  # would raise a UAC prompt. Per-user installs land in %LOCALAPPDATA%\Programs and need
  # no elevation, so the updater can swap the app out silently and relaunch it.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hearth
  # Uninstalling must never take the photo library with it; it lives in userData.
  deleteAppDataOnUninstall: false

asar: true

npmRebuild: false

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
